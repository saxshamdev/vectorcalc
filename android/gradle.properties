org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 built-in Kotlin. The app and all of its plugins (shared_preferences_android
# is already migrated) use AGP's native Kotlin support, so the legacy Kotlin Gradle
# Plugin is no longer applied. Keeping the old `false` value made AGP 9 build an
# empty classes.jar for plugin modules, which broke GeneratedPluginRegistrant.
android.newDsl=false
android.builtInKotlin=true
