name: vectorcalc
description: VECTORCALC — an offline engineering and scientific calculator.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  image: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/logo/
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#121317"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
