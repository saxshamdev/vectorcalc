analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    unused_import: warning
    dead_code: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
