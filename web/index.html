<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VECTORCALC — an offline engineering and scientific calculator.">
  <meta name="theme-color" content="#121317">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VECTORCALC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VECTORCALC</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #121317;
      overflow: hidden;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      font-family: "Courier New", monospace;
      letter-spacing: 0.32em;
      font-size: 12px;
      color: #FFB020;
      background: #121317;
      transition: opacity 260ms ease;
    }
    #boot .bar {
      width: 132px;
      height: 3px;
      background: #2a2c33;
      overflow: hidden;
    }
    #boot .bar span {
      display: block;
      width: 40%;
      height: 100%;
      background: #FFB020;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(280%); }
    }
    #boot.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">
    <div>VECTORCALC</div>
    <div class="bar"><span></span></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) {
        boot.classList.add('gone');
        setTimeout(function () { boot.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
